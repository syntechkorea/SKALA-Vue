<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="실시간 기상청 연동 날씨 대시보드와 Tmap 기반 경로 날씨·화물차 위험 알림을 제공하는 WeatherOps 웹앱">

    <title>WeatherOps — 실시간 날씨·경로 대시보드</title>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
